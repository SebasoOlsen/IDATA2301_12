<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay Finder - Login</title>
  <link rel="stylesheet" href="css/global.css">
  <link th:href="@{/styles.css}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div th:replace="fragments.html :: header"></div>

<div class="container">
  <h2>Log In</h2>
  <form class="login-form" th:action="@{/myPage}" method="get">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required>
    <button type="submit">Log In</button>
  </form>
  <div class="extra-info">
    <p>By logging in, you agree to our <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Statement</a>.</p>
  </div>
</div>

<div class="page-footer">
  <p>&copy; 2023 Stay Finder - All rights reserved.</p>
</div>

<div th:replace="fragments.html :: footer"></div>
</body>
</html>
